
<!DOCTYPE html>
<!-- Define que o documento utiliza HTML5 -->

<html lang="pt-br">
<!-- Define o idioma da página como português brasileiro -->

<head>
    <!-- Define a codificação de caracteres para aceitar acentos -->
    <meta charset="UTF-8">

    <!-- Configura a página para se adaptar ao tamanho da tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define o título que aparece na aba do navegador -->
    <title>Cadastro - Gerenciador de Tarefas</title>

    <!-- Importa o Bootstrap para utilizar seus estilos e componentes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<!-- Início do corpo da página -->
<!-- bg-light: fundo claro
     d-flex: ativa o Flexbox
     align-items-center: centraliza verticalmente
     vh-100: ocupa 100% da altura da tela -->
<body class="bg-light d-flex align-items-center vh-100">

<!-- Container principal que organiza o conteúdo -->
<div class="container">

    <!-- Cria uma linha e centraliza seu conteúdo horizontalmente -->
    <div class="row justify-content-center">

        <!-- Define a largura do conteúdo conforme o tamanho da tela -->
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">

            <!-- Cria um cartão com sombra -->
            <div class="card shadow-sm">

                <!-- Define o espaçamento interno do cartão -->
                <div class="card-body p-4">

                    <!-- Título do formulário -->
                    <h3 class="text-center mb-4">Criar Conta</h3>

                    <!-- Formulário que executa a função signup ao ser enviado -->
                    <form onsubmit="signup(event)">

                        <!-- Campo de usuário -->
                        <div class="mb-3">

                            <!-- Identifica o campo username -->
                            <label for="username" class="form-label">Usuário</label>

                            <!-- Campo onde o usuário digita seu nome de usuário -->
                            <input
                                    type="text"
                                    class="form-control"
                                    id="username"
                                    placeholder="Escolha um usuário"
                                    required
                            >
                        </div>

                        <!-- Campo de senha -->
                        <div class="mb-3">

                            <!-- Identifica o campo password -->
                            <label for="password" class="form-label">Senha</label>

                            <!-- Campo de senha: os caracteres ficam ocultos -->
                            <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    placeholder="Escolha uma senha"
                                    required
                            >
                        </div>

                        <!-- Botão responsável por enviar o formulário -->
                        <button type="submit" class="btn btn-success w-100 mb-3">
                            Criar Conta
                        </button>

                    </form>

                    <!-- Área centralizada para direcionar ao login -->
                    <div class="text-center">

                        <!-- Link para a página de login -->
                        <small>
                            Já tem uma conta?
                            <a href="login.htm">Faça login</a>
                        </small>

                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Importa o arquivo JavaScript responsável pelo cadastro -->
<script src="scripts/signup.js"></script>

</body>
</html>
